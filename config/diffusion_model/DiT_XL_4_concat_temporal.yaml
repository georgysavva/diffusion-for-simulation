model:
  _target_: src.models.DiT_concat_temporal.DiT
  time_frequency_embedding_size: 256
  num_actions: ${env.num_actions}
  input_size: 32
  in_channels: 4
  mlp_ratio: 4.0
  patch_size: 4
  hidden_size: 1152
  depth: 28
  num_heads: 16
  num_conditioning_steps: 32
  learn_sigma: ${diffusion.learn_sigma}

training:
  train_batch_size: 4
  eval_batch_size: 8
  scale_batch_size: True
  lr_warmup_steps: 100

  optimizer:
    base_lr: 1.25e-05
    
    scale_lr: True
  

