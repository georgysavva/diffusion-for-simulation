model:
  _target_: src.models.DiT_concat_temporal.DiT
  time_frequency_embedding_size: 256
  num_actions: ${env.num_actions}
  actions_type: ${env.actions_type}
  input_size: 32
  in_channels: 4
  mlp_ratio: 4.0
  patch_size: 4
  hidden_size: 24
  depth: 1
  num_heads: 1
  num_conditioning_steps: 16
  learn_sigma: ${diffusion.learn_sigma}

training:
  train_batch_size: 512
  eval_batch_size: 1024
  lr_warmup_steps: 0
  lr_decay_every_epoch: 16
  lr_decay_factor: 1

  optimizer:
    base_lr: 3.125e-07

    scale_lr: True
