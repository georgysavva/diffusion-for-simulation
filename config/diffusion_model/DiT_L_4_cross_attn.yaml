model:
  _target_: src.models.DiT_cross_attn.DiT
  time_frequency_embedding_size: 256
  num_actions: ${env.num_actions}
  actions_type: ${env.actions_type}
  input_size: 32
  in_channels: 4
  mlp_ratio: 4.0
  patch_size: 4
  hidden_size: 1024
  depth: 24
  num_heads: 16
  num_conditioning_steps: 32
  learn_sigma: ${diffusion.learn_sigma}
  separate_cross_attn: True
  share_patch_embed: True

training:
  train_batch_size: 32
  eval_batch_size: 64
  lr_warmup_steps: 100
  lr_decay_every_epoch: 16
  lr_decay_factor: 1
  
  optimizer:
    base_lr: 1.5625e-06
    scale_lr: True
  

